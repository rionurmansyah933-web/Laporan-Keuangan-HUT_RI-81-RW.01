<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Informasi & Dokumen RW.01</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl transition" title="Kembali ke Kas">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-base font-bold text-slate-800 leading-tight">Pusat Informasi & Layanan</h1>
          <p class="text-xs text-slate-500">SWADAYA WARGA RW.01</p>
        </div>
      </div>

      <a href="index.html" class="text-xs font-semibold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        <i data-lucide="wallet" class="w-4 h-4"></i> Kas RW
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">

    <div class="text-center max-w-lg mx-auto mb-8">
      <h2 class="text-xl font-bold text-slate-800">Layanan & Arsip Digital RW</h2>
      <p class="text-xs text-slate-500 mt-1">Pilih menu di bawah untuk mengakses proposal, struktur organisasi, dan galeri dokumen kegiatan warga.</p>
    </div>

    <!-- Grid Menu Ikon Utama -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">

      <!-- 1. Ikon Proposal Kegiatan (PDF) -->
      <button onclick="openPdfModal('https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', 'Proposal Kegiatan HUT RI & Lomba')" class="p-5 bg-white border border-slate-200 hover:border-emerald-500 hover:shadow-md rounded-2xl transition flex flex-col items-center text-center gap-3 group">
        <div class="p-3.5 bg-rose-50 text-rose-600 rounded-2xl group-hover:scale-110 transition">
          <i data-lucide="file-text" class="w-7 h-7"></i>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-800 group-hover:text-emerald-600">Proposal Kegiatan</h3>
          <p class="text-[10px] text-slate-400 mt-0.5">Format PDF / E-Book</p>
        </div>
      </button>

      <!-- 2. Ikon Struktur Organisasi (JPG/PDF) -->
      <button onclick="openImageModal('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80', 'Susunan Pengurus & Panitia RW.01')" class="p-5 bg-white border border-slate-200 hover:border-emerald-500 hover:shadow-md rounded-2xl transition flex flex-col items-center text-center gap-3 group">
        <div class="p-3.5 bg-blue-50 text-blue-600 rounded-2xl group-hover:scale-110 transition">
          <i data-lucide="users" class="w-7 h-7"></i>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-800 group-hover:text-emerald-600">Struktur Pengurus</h3>
          <p class="text-[10px] text-slate-400 mt-0.5">Bagan Panitia & RW</p>
        </div>
      </button>

      <!-- 3. Ikon Galeri Kegiatan & Lomba (Foto-Foto) -->
      <button onclick="openGalleryModal()" class="p-5 bg-white border border-slate-200 hover:border-emerald-500 hover:shadow-md rounded-2xl transition flex flex-col items-center text-center gap-3 group">
        <div class="p-3.5 bg-amber-50 text-amber-600 rounded-2xl group-hover:scale-110 transition">
          <i data-lucide="image" class="w-7 h-7"></i>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-800 group-hover:text-emerald-600">Galeri Kegiatan</h3>
          <p class="text-[10px] text-slate-400 mt-0.5">Dokumentasi & Lomba</p>
        </div>
      </button>

      <!-- 4. Ikon Surat Keputusan / Edaran (Opsional Tambahan) -->
      <button onclick="openPdfModal('https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', 'Surat Edaran Kerja Bakti RW.01')" class="p-5 bg-white border border-slate-200 hover:border-emerald-500 hover:shadow-md rounded-2xl transition flex flex-col items-center text-center gap-3 group">
        <div class="p-3.5 bg-emerald-50 text-emerald-600 rounded-2xl group-hover:scale-110 transition">
          <i data-lucide="scroll" class="w-7 h-7"></i>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-800 group-hover:text-emerald-600">Surat Edaran</h3>
          <p class="text-[10px] text-slate-400 mt-0.5">Dokumen Resmi RW</p>
        </div>
      </button>

    </div>
  </main>

  <!-- ================= MODAL VIEWER PDF / PROPOSAL ================= -->
  <div id="pdfModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white rounded-2xl max-w-4xl w-full h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 id="pdfTitle" class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-2">
          <i data-lucide="file-text" class="w-4 h-4 text-rose-600"></i> Viewer Proposal
        </h3>
        <button onclick="closeModal('pdfModal')" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="flex-1 bg-slate-100">
        <iframe id="pdfFrame" src="" class="w-full h-full border-0"></iframe>
      </div>
    </div>
  </div>

  <!-- ================= MODAL VIEWER GAMBAR / ORGANISASI ================= -->
  <div id="imageModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 id="imageTitle" class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4 text-blue-600"></i> Gambar Struktur
        </h3>
        <button onclick="closeModal('imageModal')" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 bg-slate-100 flex justify-center">
        <img id="singleImage" src="" alt="Dokumen" class="max-h-[70vh] rounded-xl object-contain shadow-sm">
      </div>
    </div>
  </div>

  <!-- ================= MODAL GALERI FOTO KEGIATAN ================= -->
  <div id="galleryModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-2">
          <i data-lucide="image" class="w-4 h-4 text-amber-600"></i> Dokumentasi & Foto Lomba
        </h3>
        <button onclick="closeModal('galleryModal')" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-3 bg-slate-50">
        <!-- Sampel Foto Galeri Lomba & Kerja Bakti -->
        <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=500&q=80" class="rounded-xl h-36 w-full object-cover shadow-sm hover:opacity-90 cursor-pointer" onclick="openImageModal(this.src, 'Foto Lomba Warga')">
        <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=500&q=80" class="rounded-xl h-36 w-full object-cover shadow-sm hover:opacity-90 cursor-pointer" onclick="openImageModal(this.src, 'Kegiatan Kerja Bakti')">
        <img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=500&q=80" class="rounded-xl h-36 w-full object-cover shadow-sm hover:opacity-90 cursor-pointer" onclick="openImageModal(this.src, 'Perayaan HUT RI')">
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Fungsi Buka Viewer PDF / E-Book Proposal
    function openPdfModal(url, title) {
      document.getElementById('pdfTitle').innerText = title;
      document.getElementById('pdfFrame').src = url;
      document.getElementById('pdfModal').classList.remove('hidden');
    }

    // Fungsi Buka Viewer Gambar / Struktur Organisasi
    function openImageModal(url, title) {
      document.getElementById('imageTitle').innerText = title;
      document.getElementById('singleImage').src = url;
      document.getElementById('imageModal').classList.remove('hidden');
    }

    // Fungsi Buka Modal Galeri
    function openGalleryModal() {
      document.getElementById('galleryModal').classList.remove('hidden');
    }

    // Fungsi Tutup Modal
    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
      if(modalId === 'pdfModal') document.getElementById('pdfFrame').src = '';
    }
  </script>
</body>
</html>
